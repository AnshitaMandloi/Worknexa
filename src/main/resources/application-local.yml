spring:
  datasource:
    url: jdbc:h2:mem:worknexadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

worknexa:
  jwt:
    # Local development only. Never reuse this value anywhere else.
    secret: local-dev-only-secret-0123456789-abcdefghijklmnop
  ai:
    mock-enabled: true